<style>
  html,body{height:100%;margin:0;}
  * { box-sizing: border-box; }
  body {
    background:#EEF1F0;
    color:#1E2E3F;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    padding-bottom: 40px;
  }
  .mono { font-family: "SFMono-Regular", Consolas, "Courier New", monospace; }
  header { background:#1E2E3F; padding:28px 20px 24px; }
  .header-inner { max-width:760px; margin:0 auto; }
  .brand-row { display:flex; align-items:center; gap:12px; }
  .brand-eyebrow { font-size:11px; letter-spacing:0.12em; color:#8FB3A6; margin-bottom:2px; }
  .brand-title { font-weight:700; font-size:24px; color:#F5F6F4; margin:0; }
  .header-sub { color:#B9C2CC; font-size:13px; margin-top:10px; margin-bottom:0; }
  main { max-width:760px; margin:0 auto; padding:24px 20px 0; }
  .calc-card { background:#fff; border:1px solid #D8DDE2; border-radius:10px; padding:22px; }
  .calc-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  @media (max-width:600px){ .calc-grid{ grid-template-columns:1fr; } }
  .input-col { display:flex; flex-direction:column; gap:16px; }
  .diagram-col { display:flex; flex-direction:column; align-items:center; justify-content:center; background:#F7F8F6; border-radius:8px; border:1px dashed #C7CDD6; padding:12px; }
  .field-label { display:flex; flex-direction:column; gap:6px; }
  .field-label-text { font-size:12px; font-weight:600; color:#5B6672; display:flex; align-items:center; gap:6px; }
  select, input[type=number] { padding:10px 12px; border-radius:6px; border:1px solid #C7CDD6; font-size:15px; width:100%; background:#fff; }
  input[type=number]::placeholder { color:#B9C2CC; }
  .toggle-row { display:flex; gap:8px; }
  .toggle-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px 10px; border-radius:6px; border:1px solid #C7CDD6; background:#fff; color:#5B6672; font-size:13px; font-weight:600; cursor:pointer; }
  .toggle-btn.active-day { background:#1E2E3F; color:#fff; border-color:#1E2E3F; }
  .toggle-btn.active-night { background:#2F6F62; color:#fff; border-color:#2F6F62; }
  .bracket-tag { margin-top:10px; font-size:11px; background:#E4EEE9; color:#2F6F62; padding:4px 10px; border-radius:20px; }
  .bracket-tag.warn { background:#FBE7DD; color:#B5652D; }
  .result-card { background:#1E2E3F; border-radius:10px; padding:20px 22px; margin-top:20px; color:#EAEDEF; }
  .result-row { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.08); color:#C4CBD3; }
  .total-row { display:flex; justify-content:space-between; align-items:baseline; padding-top:14px; margin-top:6px; }
  .total-num { font-weight:600; font-size:26px; color:#E29A6C; }
  .total-actions { display:flex; align-items:center; gap:10px; }
  .add-span-btn-wide { width:100%; margin-top:16px; display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 14px; border-radius:8px; border:none; background:#C9784A; color:#fff; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 2px 6px rgba(201,120,74,0.4); }
  .add-span-btn-wide:active { background:#B5652D; }
  .result-card.result-card-empty { padding:24px 22px; }
  .multi-total-card { background:#1E2E3F; border-radius:10px; padding:20px 22px; margin-top:20px; color:#EAEDEF; }
  .multi-total-row { display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.08); color:#C4CBD3; }
  .multi-total-main { display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.12); }
  .multi-total-main .total-num { font-size:28px; }
  .multi-actions { display:flex; gap:8px; margin-top:14px; }
  .multi-action-btn { flex:1; padding:9px 12px; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:transparent; color:#EAEDEF; font-size:13px; font-weight:600; cursor:pointer; }
  .multi-status { margin-top:8px; font-size:12px; color:#B9C2CC; text-align:right; min-height:1em; }
  .warn-box { display:flex; gap:10px; background:#FBE7DD; border:1px solid #EAC2A8; color:#7A3E1A; border-radius:8px; padding:12px 14px; font-size:12.5px; line-height:1.6; margin-top:18px; }
  .table-section { margin-top:22px; margin-bottom:10px; }
  .table-toggle { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid #C7CDD6; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:600; color:#1E2E3F; cursor:pointer; width:100%; justify-content:center; }

var DIAMETERS = Object.keys(RAW_TABLE).map(Number).sort(function(a,b){return a-b;});

function yen(n) {
  n = Math.round(n || 0);
  return "¥" + n.toLocaleString("ja-JP");
}

// ---------------------------------------------------------------------------
// state
// ---------------------------------------------------------------------------
var DEFAULTS = { diameter: 450, timeOfDay: "day", length: "", drillCount: "" };

var state = {
  table: JSON.parse(JSON.stringify(RAW_TABLE)),
  diameter: DEFAULTS.diameter,
  timeOfDay: DEFAULTS.timeOfDay,
  length: "",
  drillCount: "",
  multiSpanCount: 0,
  multiSpanTotal: 0,
  lastSpanAmount: null,
  multiCopyStatus: "",
  showTable: false,
  openDia: null
};

function resetInputs() {
  state.diameter = DEFAULTS.diameter;
  state.timeOfDay = DEFAULTS.timeOfDay;
  state.length = DEFAULTS.length;
  state.drillCount = DEFAULTS.drillCount;
}

function findBracket() {
  var rows = state.table[state.diameter] || [];
  var L = Math.round((Number(state.length) || 0) * 100) / 100;
  if (L <= 0) return null; // 延長が未入力(0)の場合は結果を出さない
  for (var i = 0; i < rows.length; i++) {
    if (L >= rows[i].min && L <= rows[i].max) return rows[i];
  }
  // 表の最大値(100m)を超える延長が入力された場合は、一番延長が長い区分で計算する
  return rows[rows.length - 1] || null;
}

// 入力された管径を「十の位で四捨五入」したうえで、単価表にある一番近い管径にスナップする
function snapDiameter(raw) {
  var n = Number(raw);
  if (!n || n <= 0) return DIAMETERS[0];
  var rounded10 = Math.round(n / 10) * 10;
  var nearest = DIAMETERS[0];
  var best = Infinity;
  for (var i = 0; i < DIAMETERS.length; i++) {
    var d = Math.abs(DIAMETERS[i] - rounded10);
    if (d < best) { best = d; nearest = DIAMETERS[i]; }
  }
  return nearest;
}

function computeResult(bracket) {
  if (!bracket) return null;
  var L = Number(state.length) || 0;
  var n = Number(state.drillCount) || 0;
  var base = state.timeOfDay === "day" ? bracket.dayBase : bracket.nightBase;
  var extra = state.timeOfDay === "day" ? bracket.dayExtra : bracket.nightExtra;
  var drill = state.timeOfDay === "day" ? bracket.dayDrill : bracket.nightDrill;
  var extraTotal = extra * L;
  var drillTotal = drill * n;
  var total = base + extraTotal + drillTotal;
  return { base: base, extra: extra, extraTotal: extraTotal, drill: drill, drillTotal: drillTotal, total: total, L: L, n: n };
}

}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function render() {
  var bracket = findBracket();
  var result = computeResult(bracket);

  var diameterOptions = DIAMETERS.map(function(d) {
    return '<option value="' + d + '"' + (d === state.diameter ? " selected" : "") + '>φ' + d + '</option>';
  }).join("");

          '<div><div class="brand-eyebrow">管路更生工事 · 積算</div><h1 class="brand-title">スパン単価計算機</h1></div>' +
        '</div>' +
        '<p class="header-sub">管径・延長・取付管数から、施工路線 1スパン分の請負金額を算出します</p>' +
      '</div>' +
    '</header>' +
    '<main>' +
      '<section class="calc-card">' +
        '<div class="calc-grid">' +
          '<div class="input-col">' +
            '<label class="field-label"><span class="field-label-text">' + ICONS.ruler + '管径 (mm)</span>' +

            '</label>' +
            '<label class="field-label"><span class="field-label-text">昼 / 夜</span>' +

                '<button class="toggle-btn' + (state.timeOfDay === "night" ? " active-night night-icon-red" : "") + '" id="f-night">' + (state.timeOfDay === "night" ? ICONS.moon.replace('stroke="currentColor"', 'stroke="#D32F2F"') : ICONS.moon) + ' 夜間</button>' +

            '<label class="field-label"><span class="field-label-text">管渠延長（スパン長）m</span>' +

              '<input type="number" step="1" id="f-drill" value="' + state.drillCount + '" placeholder="例：3" />' +
            '</label>' +
          '</div>' +
          '<div class="diagram-col">' +
            '<div class="field-label-text">' + ICONS.ruler + '管渠延長</div>' +
            '<div class="mono" style="font-size:22px;font-weight:700;margin-top:4px">' + (state.length !== "" ? Number(state.length || 0).toFixed(2) + ' m' : '—') + '</div>' +
            '<div style="margin-top:10px">' + bracketTagHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</section>' +
      (result ? (
        '<section class="result-card">' +
          '<div class="result-row"><span>スパン基礎単価</span><span class="mono">' + yen(result.base) + '</span></div>' +
          '<div class="result-row"><span>割増単価(m) × 延長 ' + result.L + 'm</span><span class="mono">' + yen(result.extra) + ' × ' + result.L + ' = ' + yen(result.extraTotal) + '</span></div>' +
          '<div class="result-row"><span>削孔単価 × 削孔数 ' + result.n + '</span><span class="mono">' + yen(result.drill) + ' × ' + result.n + ' = ' + yen(result.drillTotal) + '</span></div>' +

        tableHtml +
      '</section>' +
    '</main>';

  document.getElementById("root").innerHTML = html;
  bindEvents();
}

function bindEvents() {
  document.getElementById("f-diameter").addEventListener("change", function(e) {
    state.diameter = Number(e.target.value);
    render();
  });
  document.getElementById("f-day").addEventListener("click", function() {
    state.timeOfDay = "day";
    render();
  });
  document.getElementById("f-night").addEventListener("click", function() {
    state.timeOfDay = "night";
    render();
  });
  document.getElementById("f-length").addEventListener("input", function(e) {
    state.length = e.target.value;
  });
  document.getElementById("f-length").addEventListener("change", function(e) {
    state.length = e.target.value;
    render();
  });
  document.getElementById("f-drill").addEventListener("input", function(e) {
    state.drillCount = e.target.value;
  });
  document.getElementById("f-drill").addEventListener("change", function(e) {
    state.drillCount = e.target.value;
    render();
  });
  var addSpan = document.getElementById("f-add-span");
  if (addSpan) {
    addSpan.addEventListener("click", function() {
      var bracket = findBracket();
      var result = computeResult(bracket);
      if (!result) return;
      var amount = Math.round(result.total || 0);
      state.multiSpanCount += 1;
      state.multiSpanTotal += amount;
      state.lastSpanAmount = amount;
      state.multiCopyStatus = "";
      resetInputs();
      render();
    });
  }
  var copyTotal = document.getElementById("f-copy-total");
  if (copyTotal) {
    copyTotal.addEventListener("click", function() {
      var value = yen(state.multiSpanTotal);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(function() {
          state.multiCopyStatus = "コピーしました";
          render();
        }).catch(function() {
          state.multiCopyStatus = "コピーできませんでした";
          render();
        });
      } else {
        var ta = document.createElement("textarea");
        ta.value = value;
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        state.multiCopyStatus = ok ? "コピーしました" : "コピーできませんでした";
        render();
      }
    });
  }
  var resetTotal = document.getElementById("f-reset-total");
  if (resetTotal) {
    resetTotal.addEventListener("click", function() {
      state.multiSpanCount = 0;
      state.multiSpanTotal = 0;
      state.lastSpanAmount = null;
      state.multiCopyStatus = "";
      render();
    });
  }
  document.getElementById("f-show-table").addEventListener("click", function() {
    state.showTable = !state.showTable;
    render();
  });
  var diaToggles = document.querySelectorAll(".js-dia-toggle");
  for (var i = 0; i < diaToggles.length; i++) {
    diaToggles[i].addEventListener("click", function(e) {
      var dia = Number(e.currentTarget.getAttribute("data-dia"));
      state.openDia = state.openDia === dia ? null : dia;
      render();
    });
  }
  var editInputs = document.querySelectorAll(".edit-table input");
  for (var j = 0; j < editInputs.length; j++) {
    editInputs[j].addEventListener("change", function(e) {
      var dia = Number(e.target.getAttribute("data-dia"));
      var idx = Number(e.target.getAttribute("data-idx"));
      var field = e.target.getAttribute("data-field");
      var val = e.target.value === "" ? 0 : Number(e.target.value);
      state.table[dia][idx][field] = val;
      render();
    });
  }
}

render();
</script>
</body>
</html>
