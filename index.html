const DIAMETERS = Object.keys(RAW_TABLE).map(Number).sort((a, b) => a - b);
const yen = (n) => "¥" + Math.round(n || 0).toLocaleString("ja-JP");

function SpanCalculator() {
  const [table, setTable] = useState(RAW_TABLE);
  const [diameter, setDiameter] = useState(450);
  const [timeOfDay, setTimeOfDay] = useState("day");
  const [length, setLength] = useState(40);
  const [drillCount, setDrillCount] = useState(3);
  const [showTable, setShowTable] = useState(false);
  const [openDia, setOpenDia] = useState(null);

  const bracket = useMemo(() => {
    const rows = table[diameter] || [];
    const L = Number(length) || 0;
    return rows.find((r) => L >= r.min && L <= r.max) || rows[rows.length - 1];
  }, [table, diameter, length]);

  const result = useMemo(() => {
    if (!bracket) return null;
    const L = Number(length) || 0;
    const n = Number(drillCount) || 0;
    const base = timeOfDay === "day" ? bracket.dayBase : bracket.nightBase;
    const extra = timeOfDay === "day" ? bracket.dayExtra : bracket.nightExtra;
    const drill = timeOfDay === "day" ? bracket.dayDrill : bracket.nightDrill;
    const extraTotal = extra * L;
    const drillTotal = drill * n;
    const total = base + extraTotal + drillTotal;
    return { base, extra, extraTotal, drill, drillTotal, total, L, n };
  }, [bracket, timeOfDay, length, drillCount]);

  const updateCell = (dia, idx, field, value) => {
    setTable((prev) => {
      const next = { ...prev };
      const rows = [...next[dia]];
      rows[idx] = { ...rows[idx], [field]: value === "" ? 0 : Number(value) };
      next[dia] = rows;
      return next;
    });
  };

  const pipeR = Math.min(70, 26 + diameter / 22);

  return (
    <div style={styles.page}>
      <header style={styles.header}>
        <div style={styles.headerInner}>
          <div style={styles.brandRow}>
            <div style={styles.brandMark}>
              <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
                <circle cx="17" cy="17" r="14" stroke="#C9784A" strokeWidth="2.5" />
                <circle cx="17" cy="17" r="7.5" stroke="#C9784A" strokeWidth="2.5" />
              </svg>
            </div>
            <div>
              <div style={styles.brandEyebrow}>管路更生工事 · 積算</div>
              <h1 style={styles.brandTitle}>スパン単価計算機</h1>
            </div>
          </div>
          <p style={styles.headerSub}>管径・延長・取付管数から、施工路線 1スパン分の請負金額を算出します</p>
        </div>
      </header>

      <main style={styles.main}>
        <section style={styles.calcCard}>
          <div style={styles.calcGrid}>
            <div style={styles.inputCol}>
              <Field label="管径 (mm)" icon={<RulerIcon size={15} />}>
                <select style={styles.select} value={diameter} onChange={(e) => setDiameter(Number(e.target.value))}>
                  {DIAMETERS.map((d) => (<option key={d} value={d}>φ{d}</option>))}
                </select>
              </Field>

              <Field label="昼 / 夜">
                <div style={styles.toggleRow}>
                  <button style={{ ...styles.toggleBtn, ...(timeOfDay === "day" ? styles.toggleBtnActiveDay : {}) }} onClick={() => setTimeOfDay("day")}>
                    <SunIcon size={14} /> 昼間
                  </button>
                  <button style={{ ...styles.toggleBtn, ...(timeOfDay === "night" ? styles.toggleBtnActiveNight : {}) }} onClick={() => setTimeOfDay("night")}>
                    <MoonIcon size={14} /> 夜間
                  </button>
                </div>
              </Field>

              <Field label="管渠延長（スパン長）m">
                <input type="number" step="0.1" style={styles.numInput} value={length} onChange={(e) => setLength(e.target.value)} />
              </Field>

              <Field label="取付管数（本）" icon={<WrenchIcon size={15} />}>
                <input type="number" step="1" style={styles.numInput} value={drillCount} onChange={(e) => setDrillCount(e.target.value)} />
              </Field>
            </div>

            <div style={styles.diagramCol}>
              <svg viewBox="0 0 320 160" style={{ width: "100%", maxWidth: 320 }}>
                <line x1="24" y1="80" x2="296" y2="80" stroke="#B9C2CC" strokeWidth="2" strokeDasharray="4 4" />
                <circle cx="60" cy="80" r={pipeR} fill="none" stroke="#1E2E3F" strokeWidth="3" />
                <circle cx="60" cy="80" r={Math.max(4, pipeR - 10)} fill="none" stroke="#C9784A" strokeWidth="2" />
                <circle cx="260" cy="80" r={pipeR} fill="none" stroke="#1E2E3F" strokeWidth="3" />
                <circle cx="260" cy="80" r={Math.max(4, pipeR - 10)} fill="none" stroke="#C9784A" strokeWidth="2" />
                <line x1="60" y1="30" x2="260" y2="30" stroke="#2F6F62" strokeWidth="1.5" />
                <line x1="60" y1="24" x2="60" y2="36" stroke="#2F6F62" strokeWidth="1.5" />
                <line x1="260" y1="24" x2="260" y2="36" stroke="#2F6F62" strokeWidth="1.5" />
                <text x="160" y="20" textAnchor="middle" fontFamily="IBM Plex Mono" fontSize="13" fill="#2F6F62">{Number(length || 0).toFixed(1)} m</text>
                <text x="60" y="130" textAnchor="middle" fontFamily="IBM Plex Mono" fontSize="12" fill="#5B6672">φ{diameter}</text>
                <text x="260" y="130" textAnchor="middle" fontFamily="IBM Plex Mono" fontSize="12" fill="#5B6672">φ{diameter}</text>
                {Array.from({ length: Math.min(Number(drillCount) || 0, 8) }).map((_, i) => {
                  const n = Math.min(Number(drillCount) || 0, 8);
                  const x = 60 + ((260 - 60) / (n + 1)) * (i + 1);
                  return (<g key={i}><line x1={x} y1="80" x2={x} y2="58" stroke="#C9784A" strokeWidth="2" /><circle cx={x} cy="58" r="3" fill="#C9784A" /></g>);
                })}
              </svg>
              {bracket ? (
                <div style={styles.bracketTag}>適用区分：{bracket.min}m 〜 {bracket.max}m</div>
              ) : (
                <div style={styles.bracketTagWarn}>該当区分なし</div>
              )}
            </div>
          </div>
        </section>

        {result && (
          <section style={styles.resultCard}>
            <div style={styles.resultRow}><span>スパン基礎単価</span><span style={styles.mono}>{yen(result.base)}</span></div>
            <div style={styles.resultRow}><span>割増単価(m) × 延長 {result.L}m</span><span style={styles.mono}>{yen(result.extra)} × {result.L} = {yen(result.extraTotal)}</span></div>
            <div style={styles.resultRow}><span>削孔単価 × 取付管 {result.n}本</span><span style={styles.mono}>{yen(result.drill)} × {result.n} = {yen(result.drillTotal)}</span></div>
            <div style={styles.totalRow}><span>1スパンあたり請負金額</span><span style={styles.totalNum}>{yen(result.total)}</span></div>
          </section>
        )}

        <div style={styles.warnBox}>
          <AlertTriangleIcon size={16} style={{ flexShrink: 0, marginTop: 2 }} />
          <p style={{ margin: 0 }}>単価表は提供いただいた資料から転記したものです。念のため、下の「単価表を確認・編集」で原本と見比べ、誤りがあれば修正してください。</p>
        </div>

        <section style={styles.tableSection}>
          <button style={styles.tableToggle} onClick={() => setShowTable((s) => !s)}>
            <Settings2Icon size={16} /> 単価表を確認・編集
            <ChevronDownIcon size={16} style={{ transform: showTable ? "rotate(180deg)" : "none", transition: "transform .2s" }} />
          </button>

          {showTable && (
            <div style={styles.tableWrap}>
              {DIAMETERS.map((dia) => (
                <div key={dia} style={styles.diaBlock}>
                  <button style={styles.diaHeader} onClick={() => setOpenDia(openDia === dia ? null : dia)}>
                    <span style={styles.diaHeaderLabel}>φ{dia}</span>
                    <ChevronDownIcon size={15} style={{ transform: openDia === dia ? "rotate(180deg)" : "none", transition: "transform .2s" }} />
                  </button>
                  {openDia === dia && (
                    <div style={{ overflowX: "auto" }}>
                      <table style={styles.editTable}>
                        <thead>
                          <tr>
                            <th style={styles.th}>区分(m)</th>
                            <th style={styles.thGroup} colSpan={3}>昼</th>
                            <th style={styles.thGroup} colSpan={3}>夜</th>
                          </tr>
                          <tr>
                            <th style={styles.th}></th>
                            <th style={styles.th}>基礎単価</th><th style={styles.th}>割増(m)</th><th style={styles.th}>削孔単価</th>
                            <th style={styles.th}>基礎単価</th><th style={styles.th}>割増(m)</th><th style={styles.th}>削孔単価</th>
                          </tr>
                        </thead>
                        <tbody>
                          {table[dia].map((row, idx) => (
                            <tr key={idx}>
                              <td style={styles.tdLabel}>{row.min}〜{row.max}</td>
                              {["dayBase", "dayExtra", "dayDrill", "nightBase", "nightExtra", "nightDrill"].map((field) => (
                                <td style={styles.td} key={field}>
                                  <input type="number" value={row[field]} onChange={(e) => updateCell(dia, idx, field, e.target.value)} style={styles.editInput} />
                                </td>
                              ))}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </section>
      </main>
    </div>
  );
}

function Field({ label, icon, children }) {
  return (
    <label style={styles.fieldLabel}>
      <span style={styles.fieldLabelText}>{icon}{label}</span>
      {children}
    </label>
  );
}
